services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contrib_radar
      POSTGRES_PASSWORD: contrib_radar
      POSTGRES_DB: contrib_radar
    ports:
      - "5432:5432"
    volumes:
      - contrib-radar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contrib_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contrib-radar-postgres:
