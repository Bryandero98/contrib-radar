name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Same credentials as docker-compose.yml's local postgres service, so
    # DATABASE_URL below matches .env.example exactly. Without this service,
    # every describeIfDb-gated suite (health, watched-repos, refresh, both
    # e2e specs) silently skips itself in CI - CONTRIBUTING.md's "no mocks
    # on the database" promise only holds if DATABASE_URL is actually set
    # here, not just documented as something a contributor sets locally.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: contrib_radar
          POSTGRES_PASSWORD: contrib_radar
          POSTGRES_DB: contrib_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://contrib_radar:contrib_radar@localhost:5432/contrib_radar
      # Placeholders, not real credentials: AuthModule/BillingModule's
      # provider factories throw at boot if these are unset at all (same
      # fail-fast pattern as DATABASE_URL above), so every describeIfDb
      # suite that builds the full AppModule (app/contrib-radar/auth-and-
      # billing e2e specs) needs *something* here even though the real
      # GitHub OAuth App and Stripe product don't exist yet - see
      # .env.example for what each one is for.
      GITHUB_OAUTH_CLIENT_ID: ci-placeholder
      GITHUB_OAUTH_CLIENT_SECRET: ci-placeholder
      JWT_SECRET: ci-placeholder-jwt-secret
      APP_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_ci-placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci-placeholder
      STRIPE_PRO_PRICE_ID: price_ci-placeholder
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - run: npm run test:e2e
